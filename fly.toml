app = 'bot-factory-rwmfna-rough-voice-4240'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python factory_bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
